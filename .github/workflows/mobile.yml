name: Mobile & Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-core-and-desktop:
    name: Rust Core, CLI, Relay & Electron Bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Clippy (Workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (core-ffi napi-addon)
        run: cargo clippy -p core-ffi --features napi-addon -- -D warnings
      - name: Cargo Test (Workspace)
        run: cargo test --workspace
      - name: Build & Smoke-Test Electron napi-rs Addon & UI
        working-directory: ui
        run: |
          npm ci --ignore-scripts
          npm run build:native
          npm run test:native
          npm run typecheck
          npm run build

  android:
    name: Flutter Android + Rust core-mobile-ffi (cargo-ndk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install cargo-ndk & flutter_rust_bridge_codegen
        run: |
          cargo install cargo-ndk --locked
          cargo install flutter_rust_bridge_codegen --version "^2.13" --locked
      - name: Scaffold Android Runner Assets & Fetch Dart Dependencies
        working-directory: mobile
        run: |
          rm -f android/settings.gradle.kts android/gradle/wrapper/gradle-wrapper.properties
          flutter create --no-pub --platforms=android --org dev.veloce --project-name veloce_mobile .
          rm -f test/widget_test.dart
          rm -f android/build.gradle android/settings.gradle android/app/build.gradle
          rm -rf android/app/src/main/kotlin/dev/veloce/veloce_mobile
          if ! grep -q "kotlin.android" android/settings.gradle.kts; then
            sed -i '/id("kotlin-android")/d' android/app/build.gradle.kts
          fi
          flutter pub get
      - name: Generate flutter_rust_bridge bindings
        run: flutter_rust_bridge_codegen generate
      - name: Build Android Rust Libraries (16 KB page aligned)
        run: bash mobile/scripts/build-android-rust.sh release
      - name: Flutter Analyze & Test
        working-directory: mobile
        run: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build & Verify Signed Android APK
        working-directory: mobile
        env:
          VELOCE_KEYSTORE_BASE64: ${{ secrets.VELOCE_KEYSTORE_BASE64 }}
          VELOCE_KEYSTORE_PASSWORD: ${{ secrets.VELOCE_KEYSTORE_PASSWORD }}
          VELOCE_KEY_ALIAS: ${{ secrets.VELOCE_KEY_ALIAS }}
          VELOCE_KEY_PASSWORD: ${{ secrets.VELOCE_KEY_PASSWORD }}
        run: |
          if [ -n "${VELOCE_KEYSTORE_BASE64:-}" ]; then
            echo "${VELOCE_KEYSTORE_BASE64}" | base64 --decode > /tmp/veloce-release.jks
            export VELOCE_KEYSTORE_PATH="/tmp/veloce-release.jks"
            trap 'rm -f /tmp/veloce-release.jks' EXIT
            echo "[veloce] Signing APK with configured release keystore"
          else
            echo "[veloce] Release keystore secrets not set; signing preview APK with debug key"
          fi
          flutter build apk --release
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "${APKSIGNER}" ]; then
            "${APKSIGNER}" verify --verbose --print-certs "${APK}"
          else
            jarsigner -verify -verbose "${APK}"
          fi
      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: veloce-android-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: Flutter iOS + Rust core-mobile-ffi (aarch64-apple-ios)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version "^2.13" --locked
      - name: Scaffold iOS Runner Project & Fetch Dart Dependencies
        working-directory: mobile
        run: |
          flutter create --no-pub --platforms=ios --org dev.veloce --project-name veloce_mobile .
          rm -f test/widget_test.dart
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g' ios/Runner.xcodeproj/project.pbxproj
          flutter pub get
      - name: Generate flutter_rust_bridge bindings
        run: flutter_rust_bridge_codegen generate
      - name: Build iOS Static Library & XCFramework
        run: bash mobile/scripts/build-ios-rust.sh
      - name: Flutter Analyze & Test
        working-directory: mobile
        run: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build iOS (no-codesign)
        working-directory: mobile
        run: flutter build ios --release --no-codesign
      - name: Verify Rust FFI Symbols Linked in iOS Runner Binary
        working-directory: mobile
        run: |
          RUNNER_BIN="build/ios/iphoneos/Runner.app/Runner"
          test -f "${RUNNER_BIN}"
          nm -gU "${RUNNER_BIN}" | grep -E "veloce_core_ios_anchor|frb_pde_ffi_dispatcher|frb_get_rust_content_hash|frbgen_" | head -n 20
          nm -gU "${RUNNER_BIN}" | grep -q "veloce_core_ios_anchor"
          nm -gU "${RUNNER_BIN}" | grep -qE "frb_pde_ffi_dispatcher|frb_get_rust_content_hash|frbgen_"
