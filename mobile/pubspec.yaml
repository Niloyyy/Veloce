name: veloce_mobile
description: Veloce Cross-Platform Local & Global P2P File Transfer (Flutter + Rust QUIC BBR)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.4
  flutter_rust_bridge: ^2.13.0
  freezed_annotation: ^2.4.4
  mobile_scanner: ^6.0.2
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  share_plus: ^10.1.2
  shared_preferences: ^2.3.3
  wakelock_plus: ^1.2.8

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7

flutter:
  uses-material-design: true
