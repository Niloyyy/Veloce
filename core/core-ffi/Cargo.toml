[package]
name = "core-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Async napi-rs FFI bridge exposing Veloce Rust engine commands and event streams to Electron"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
napi-addon = ["dep:napi", "dep:napi-derive", "dep:serde_json"]

[dependencies]
core-protocol = { path = "../core-protocol" }
core-storage = { path = "../core-storage" }
core-transport = { path = "../core-transport" }
hex.workspace = true
napi = { version = "2.16", default-features = false, features = ["napi8", "async", "tokio_rt", "serde-json"], optional = true }
napi-derive = { version = "2.16", optional = true }
serde.workspace = true
serde_json = { version = "1.0", optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[build-dependencies]
napi-build = "2.1"

[dev-dependencies]
tempfile.workspace = true
veloce-relay = { path = "../../relay" }
