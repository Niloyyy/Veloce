[package]
name = "core-mobile-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "flutter_rust_bridge v2 FFI bindings exposing VeloceEngine to Flutter on Android and iOS"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
core-ffi = { path = "../core-ffi", default-features = false }
core-protocol = { path = "../core-protocol" }
flutter_rust_bridge.workspace = true
serde.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
